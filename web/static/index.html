<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twitch Bot – Administration</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Twitch Bot</h1>
    <div class="status" id="status" aria-live="polite">
      <span class="pill" id="bot-pill">Bot : …</span>
      <span class="pill" id="spotify-pill">Spotify : …</span>
      <span id="spotify-action"></span>
    </div>
  </header>

  <div id="toast" class="toast" role="status" hidden></div>

  <main class="grid">
    <section class="panel">
      <h2>Commandes personnalisées</h2>
      <p class="hint">Variables : <code>{user}</code> (auteur), <code>{channel}</code>, <code>{args}</code> (texte après la commande).</p>
      <form id="cmd-form" autocomplete="off">
        <label>Nom
          <input id="cmd-name" required maxlength="33" placeholder="discord" pattern="!?[\p{L}\p{N}_]{1,32}">
        </label>
        <label>Réponse
          <textarea id="cmd-response" required maxlength="400" rows="3" placeholder="Rejoins le Discord : https://…"></textarea>
        </label>
        <label>Délai global (secondes)
          <input id="cmd-cooldown" type="number" min="0" max="3600" value="5">
        </label>
        <div class="row">
          <button type="submit" id="cmd-submit">Ajouter</button>
          <button type="button" id="cmd-cancel" class="secondary" hidden>Annuler la modification</button>
        </div>
      </form>
      <ul class="list" id="commands"></ul>
    </section>

    <section class="panel">
      <h2>Demandes de musique</h2>
      <p class="hint">Historique des titres ajoutés à la file Spotify via <code>!song</code>.</p>
      <div class="row">
        <button type="button" id="req-refresh" class="secondary">Actualiser</button>
        <button type="button" id="req-clear" class="danger">Vider l'historique</button>
      </div>
      <ul class="list" id="requests"></ul>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
