services:
  twitch-bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: twitch-bot
    restart: unless-stopped
    env_file: .env
    environment:
      # Fixés ici : le port interne ne change jamais, seul HOST_PORT (côté hôte) est configurable.
      PORT: "9090"
      DB_PATH: /data/bot.db
    ports:
      # Par défaut uniquement en local (127.0.0.1) : l'authentification Basic circule en clair en HTTP.
      # Voir DEPLOYMENT.md pour l'accès distant (tunnel SSH ou reverse proxy HTTPS).
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-9190}:9090"
    volumes:
      - twitch-bot-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  twitch-bot-data:
