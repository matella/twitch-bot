name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # go.mod et go.sum sont versionnés : la CI vérifie qu'ils sont à jour au lieu de les réécrire.
      # En cas d'échec : `make tidy`, puis commiter go.mod et go.sum.
      - name: go.mod et go.sum à jour
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # Construit réellement l'image de déploiement, comme sur matelab.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t twitch-bot:ci .
      - name: Smoke test (sans configuration, le binaire doit s'arrêter avec un message clair)
        run: |
          set +e
          out=$(docker run --rm twitch-bot:ci 2>&1); code=$?
          echo "$out"
          [ "$code" -eq 1 ] && echo "$out" | grep -q "variables d'environnement manquantes"
