name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pour figer go.mod / go.sum dans le dépôt (voir la dernière étape)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      # Résout les dépendances (écrit go.mod / go.sum), puis compile et teste avec ces versions.
      - run: go mod tidy
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # Fige les versions résolues dans le dépôt : les builds Docker deviennent reproductibles.
      # Sans effet quand go.mod / go.sum sont déjà à jour ; un push fait avec GITHUB_TOKEN ne relance pas la CI.
      - name: Figer go.mod et go.sum
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m "chore: fige go.mod et go.sum [skip ci]"
            git push
          fi

  # Construit réellement l'image de déploiement, comme sur matelab.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t twitch-bot:ci .
      - name: Smoke test (sans configuration, le binaire doit s'arrêter avec un message clair)
        run: |
          set +e
          out=$(docker run --rm twitch-bot:ci 2>&1); code=$?
          echo "$out"
          [ "$code" -eq 1 ] && echo "$out" | grep -q "variables d'environnement manquantes"
